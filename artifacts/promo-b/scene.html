<script>
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const lerp=(a,b,p)=>a+(b-a)*p;
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const eOut=p=>1-Math.pow(1-p,3);
const eInOut=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eBack=p=>{const c=1.9,q=p-1;return 1+(c+1)*q*q*q+c*q*q;};
/** 确定性哈希 —— 全片唯一的"随机"来源，绝不用 Math.random */

  askEl.style.top="700px";
  // 逐字打出来。注意用 innerHTML 是为了让 <br> 生效，

  const l1=typed("你只需要说一次",seg(p,0.05,0.26));
  const l2=typed("你要找什么",seg(p,0.26,0.42));
  askH.innerHTML=l1+"<br>"+l2;
  document.getElementById("askEb").style.opacity=seg(p,0.0,0.10);

  tgts.forEach((el,i)=>{
    const pi=seg(p,0.40+i*0.09,0.40+i*0.09+0.20);
    el.style.opacity=pi;
    el.style.transform="scale("+lerp(0.86,1,eBack(pi))+")";
    // 落格瞬间点绿：把"这就是你的条件"讲明白
    if(pi>=1) el.classList.add("on"); else el.classList.remove("on");
  });

  askSub.style.opacity=seg(p,0.74,0.92);
  askSub.innerHTML="剩下的每天自动跑<br>你不用再一个个刷官网";
  L.ask.style.transform="scale("+(1+0.03*eInOut(p))+")";
}

// ══════════════════════════════════════════════════════════
//  ② 价值一：适合你的官方岗位
// ══════════════════════════════════════════════════════════
function drawJobs(t){
  const p=seg(t,T.jobs[0],T.jobs[1]);
  jobsHead.style.top="250px";
  jobsHead.style.opacity=seg(p,0.0,0.10);
  jobsH.innerHTML="筛出适合你的岗位<br><span style='color:#00e676'>点开就是企业官网</span>";

  document.getElementById("jobs").style.top="510px";
  cards.forEach((el,i)=>{
    const pi=seg(p,0.06+i*0.075,0.06+i*0.075+0.24);
    el.style.opacity=pi;
    el.style.transform="translate3d(0,"+lerp(52,0,eBack(pi))+"px,0) scale("+lerp(0.96,1,eBack(pi))+")";
  });

  // 覆盖广度：实习/校招/社招 · 国内/海外 —— 逐个亮起
  brEl.style.top="1290px";
  brs.forEach((el,i)=>{
    const pi=seg(p,0.34+i*0.045,0.34+i*0.045+0.16);
    el.style.opacity=pi;
    el.style.transform="scale("+lerp(0.88,1,eBack(pi))+")";
  });

  // 点第一张卡的「官网直达」→ 地址栏推上来，证明是官方链接
  const pt=seg(p,0.58,0.66);
  goEls[0].className="go"+(pt>0.4?" lit":"");
  cards[0].style.transform=cards[0].style.transform.replace(/ scale\([^)]*\)$/,
    " scale("+(1+0.018*Math.sin(clamp(pt,0,1)*Math.PI))+")");

  const pu=seg(p,0.64,0.86);
  urlbar.style.top="1430px";
  urlbar.style.opacity=pu;
  urlbar.style.transform="translate3d(0,"+lerp(40,0,eOut(pu))+"px,0) scale("+lerp(0.95,1,eBack(pu))+")";
  urlText.textContent=typed(OFFICIAL_URL,seg(p,0.66,0.90));

  L.jobs.style.transform="scale("+(1+0.028*eInOut(p))+")";
}

// ══════════════════════════════════════════════════════════
//  ③ 价值二：职业洞察 = 信息差
// ══════════════════════════════════════════════════════════
function drawIns(t){
  const p=seg(t,T.ins[0],T.ins[1]);
  insHead.style.top="180px";
  insHead.style.opacity=seg(p,0.0,0.09);
  insH.innerHTML="再告诉你<span style='color:#00e676'>该不该去</span><br>时机 · 薪酬强度 · 路径 · 文化";

  drawerCo.textContent="字节跳动 · 职业洞察";
  // 抽屉从底部推上来
  const pd=seg(p,0.06,0.30);
  drawer.style.height="1360px";
  drawer.style.transform="translate3d(0,"+lerp(1360,0,eOut(pd))+"px,0)";
  drawer.style.opacity=1;

  insEls.forEach((el,i)=>{
    const pi=seg(p,0.26+i*0.13,0.26+i*0.13+0.26);
    el.style.opacity=pi;
    el.style.transform="translate3d(0,"+lerp(26,0,eOut(pi))+"px,0)";
  });
  L.ins.style.transform="scale("+(1+0.022*eInOut(p))+")";
}

// ══════════════════════════════════════════════════════════
//  ④ 于是你能选
// ══════════════════════════════════════════════════════════
function drawCmp(t){
  const p=seg(t,T.cmp[0],T.cmp[1]);
  cmpHead.style.top="300px";
  cmpHead.style.opacity=seg(p,0.0,0.12);
  cmpH.innerHTML="两个都能投的时候<br>你知道<span style='color:#00e676'>哪个更适合你</span>";

  cmpEl.style.top="700px";
  cols.forEach((el,i)=>{
    const pi=seg(p,0.10+i*0.11,0.10+i*0.11+0.30);
    el.style.opacity=pi;
    el.style.transform="translate3d(0,"+lerp(44,0,eBack(pi))+"px,0) scale("+lerp(0.95,1,eBack(pi))+")";
  });
  cmpNote.style.top="1560px";
  cmpNote.style.opacity=seg(p,0.62,0.86);
  cmpNote.innerHTML="按你自己的承受度选，不是按谁名气大";
  L.cmp.style.transform="scale("+(1+0.024*eInOut(p))+")";
}

// ══════════════════════════════════════════════════════════
//  ⑤ 品牌
// ══════════════════════════════════════════════════════════
function drawBrand(t){
  const p=seg(t,T.brand[0],T.brand[1]);
  brandEl.style.top="620px";
  const pl=seg(p,0.04,0.40);
  lockup.style.opacity=pl;
  lockup.style.transform="scale("+lerp(0.93,1,eBack(pl))+")";
  bsweep.setAttribute("transform","rotate("+(eOut(seg(p,0.06,0.62))*360)+" 24 24)");
  bblip.setAttribute("opacity",String(0.35+0.65*Math.abs(Math.sin(seg(p,0.1,1)*Math.PI*3))));
  kicker.style.opacity=seg(p,0.28,0.60);
  kicker.style.transform="translate3d(0,"+lerp(20,0,eOut(seg(p,0.28,0.60)))+"px,0)";
  const pc=seg(p,0.50,0.78);
  ctaEl.style.opacity=pc;
  ctaEl.style.transform="scale("+lerp(0.94,1,eBack(pc))+")";
  L.brand.style.transform="scale("+(1+0.02*eInOut(p))+")";
}

// ══════════════════════════════════════════════════════════
//  主入口
// ══════════════════════════════════════════════════════════
window.__render=function(t){
  t=clamp(t,0,DUR);
  const a=t<T.jobs[0], b=t>=T.jobs[0]&&t<T.ins[0],
        c=t>=T.ins[0]&&t<T.cmp[0], d=t>=T.cmp[0]&&t<T.brand[0], e=t>=T.brand[0];
  show(L.ask,a);show(L.jobs,b);show(L.ins,c);show(L.cmp,d);show(L.brand,e);
  if(a)drawAsk(t); if(b)drawJobs(t); if(c)drawIns(t); if(d)drawCmp(t); if(e)drawBrand(t);

  let fl=0;
  [T.jobs[0],T.ins[0],T.cmp[0],T.brand[0]].forEach(x=>{
    const dd=Math.abs(t-x); if(dd<0.034) fl=Math.max(fl,1-dd/0.034);
  });
  flash.style.opacity=fl*0.7;
};

window.__setSize(1080,1920);
window.__render(0);
</script>
