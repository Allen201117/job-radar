# 覆盖率差集的显式豁免清单。豁免 = 承认这条差集存在、但有理由不追。
# 每条必须带非空 reason（`audit_coverage.load_exemptions` 校验），拿不出理由不许豁免——
# 拿不准就别加在这里，让它留在差集报告里，那正是这个模块存在的目的。
#
# 四个分类名对应 audit_coverage.compute_gaps 的四个差集键；键是被豁免的具体名字
# （workflow 路径 / module 名 / jobs 列名 / 指标键），值是理由。

pipeline_workflows:
  .github/workflows/backfill-job-function.yml: "scripts/backfill-job-function.js 不写 ops_runs（也不写任何别的运行台账），没有可查的『它跑没跑』信号；它的效果已经被 jobs.function_pending 这条数据层检查间接盯住（NULL 堆高 = 补算任务停了），2026-09-19 复核确认无遗漏。"
  .github/workflows/backfill-recruitment-category.yml: "同上一条，scripts/backfill-recruitment-category.js 也不写任何运行台账，效果由 jobs.recruitment_type_pending 间接盯住。"
  .github/workflows/enrich-crawl.yml: "crawler/run.py 写 ops_runs 时模块名恒为 daily_crawl，与 daily-crawl.yml 完全同名，metrics 里也没有能区分『这轮是快档还是富化档』的字段（2026-09-19 读代码确认）。已用 pipeline.daily_crawl_ran 覆盖『daily_crawl 这个模块今天有没有活动』，但没法单独证明是这条 workflow 而不是那条在跑。"
  .github/workflows/dead-link-audit-new.yml: "audit_dead_links.py 写 ops_runs 时模块名恒为 dead_link_audit，与 dead-link-audit.yml 完全同名，没有字段能区分是全量轮转档还是高频新岗档（2026-09-19 读代码确认）。已用 pipeline.dead_link_audit_ran 覆盖『dead_link_audit 这个模块今天有没有活动』。"
  .github/workflows/campus-crawl.yml: "campus_crawl.py 确实写独立模块名 campus_lane，但这条车道设计上只在校招季（8-11月/2-4月）且『距上轮真跑完 ≥50min』时才真的执行（crawler/campus_lane_gate.py 的频率闸），淡季整月零记录是设计好的正常状态，不是故障。固定窗口的『>=1』existence 检查会在淡季持续无意义地报警（狼来了），2026-09-19 判断先不接，等按声明周期换算窗口的通用机制做出来再接（同 ops_watchdog.py 里『周任务规则 A 结构性缺口』那条注释是同一类问题）。"

pipeline_modules: {}
  # 同上：ops_runs 里出现的模块目前没有被豁免的，MODULE_OUTPUT/NO_OUTPUT_MODULES
  # 已经是它自己的期望清单，覆盖率差集只是拿它当右边对照，不重复定义豁免。

data_columns:
  id: "uuid 主键，纯技术标识，没有业务语义可判『正常』"
  created_at: "行创建时间，与 first_seen_at（已被 jobs.new_yesterday 检查覆盖）语义重复，只是历史遗留的另一个时间戳"
  content_hash: "内部去重指纹，用于判断列表重抓时内容有没有变化，不是面向业务的字段"
  search_doc: "内部 tsvector 缓存列，schema.sql 自己注释『v1 不填，FTS 后置 pass 再启用』，当前没有任何写入路径产出真实内容"
  source_id: "外键，指向 sources 表；它本身没有独立取值范围，异常表现在 sources 侧的检查项里"

experience_metrics: {}
  # 体验层还没有 contract 检查项落地，暂不豁免任何指标——先让差集把全部指标列出来，
  # 等真正决定哪些指标要有阈值时再补 experience 层检查项，而不是先消音。
