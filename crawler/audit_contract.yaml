    subject: 主抓取车道
    layer: pipeline
    db: supabase
    owner: .github/workflows/daily-crawl.yml
    sql: >
      select count(*) from ops_runs where module = 'daily_crawl'
        and run_date >= ((now() at time zone 'Asia/Shanghai')::date - 1)
    normal: ">= 1"                # 实测 36（一天 4 轮 × 多片，远高于 1）
    severity: critical
    calibrated: false
    why: 这是全站岗位供给的主车道，每天固定跑几轮。一天一次记录都没有，说明抓取彻底停了。
    action: 看这条车道最近一次 GitHub Actions 运行是失败还是根本没触发

