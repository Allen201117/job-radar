    source: watchdog
    normal: "== 0"
    severity: warn
    calibrated: false
    why: 某一类抓取方式（比如某个招聘系统平台）整体产出比平时大幅下降，但任务状态照样显示成功，靠这个信号才能发现。
    action: 看命中的是哪一类来源，对比它平时和现在的产出差多少

  - id: watchdog.rule_l
    name: 某个来源本该每天被抓却断更了
    layer: pipeline
    owner: crawler/ops_watchdog.py
    rule: L
    source: watchdog
    normal: "== 0"
    severity: warn
    calibrated: false
    why: 一个本来每天都会被抓一遍的来源，突然连一次运行记录都没有了——不是抓失败，是这一轮根本没轮到它。
    action: 看命中的来源，确认它是不是被排除在了本轮抓取范围之外

  - id: watchdog.rule_m
    name: 需要在创始人电脑上跑的公告抓取失联了
    layer: pipeline
    owner: crawler/ops_watchdog.py
    rule: M
    source: watchdog
    normal: "== 0"
    severity: warn
    calibrated: false
    why: 部分省份的官方公告只能从创始人自己电脑上的定时任务抓，超过约定时间没有收到它的运行记录。
    action: 确认创始人电脑上的定时任务是不是还在正常运行

  - id: watchdog.rule_n
    name: 抓取任务结束时两次都没能把结果写下来
    layer: pipeline
    owner: crawler/ops_watchdog.py
    rule: N
    source: watchdog
    normal: "== 0"
    severity: critical
    calibrated: false
    why: 抓取进程本身跑完了，但连着两次想把「跑完了」这件事记下来都失败了，只留在会被截断的运行日志里，没人看得到。
    action: 看命中的任务，查它写运行记录那一步为什么连续失败

  - id: watchdog.rule_o
    name: 必投公司的校招入口还没接上
    layer: data
    owner: crawler/ops_watchdog.py
    rule: O
    source: watchdog
    normal: "== 0"
    severity: warn
    calibrated: false
    why: 校招季里，必投清单上的公司却连一个校招岗位的入口都没有接上，用户按公司找是找不到的，而这个情况在别的统计口径里会被误判成「一切正常」。
    action: 看命中的公司，按它用的招聘系统去接上对应的校招板块

  - id: watchdog.rule_p
    name: 职业洞察供给停摆了
    layer: data
    owner: crawler/ops_watchdog.py
    rule: P
    source: watchdog
    normal: "== 0"
    severity: warn
    calibrated: false
    why: 洞察库最近一周新增的有效条目太少——这条任务每天都在处理公司、数字从不为 0，光看「有没有在跑」看不出它其实几乎没有真产出。
    action: 查最近几天洞察抓取的处理量和真正写入的条目数，看是不是卡在了某个环节
