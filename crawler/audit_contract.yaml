  - id: exp.fake_green_sources_yesterday
    name: 假绿体检：昨天「报成功却一个岗都没抓回来」的来源数
    layer: experience
    db: supabase
    owner: crawler/run.py
    sql: >
      select count(distinct source_id) from crawl_runs
      where status = 'success' and jobs_found = 0
        and started_at >= (date_trunc('day', now() at time zone 'Asia/Shanghai') - interval '1 day') at time zone 'Asia/Shanghai'
        and started_at <  date_trunc('day', now() at time zone 'Asia/Shanghai') at time zone 'Asia/Shanghai'
    normal: "<= 50"
    severity: warn
    covers: []
    calibrated: false
    why: 「绿灯」不等于「有产出」。故意不用 jobs_created=0（那是常态，84% 的运行都是 0），只看 jobs_found=0——一个岗都没在列表里看到，却报成功，是最典型的假绿。
    action: 挑几个来源看看是不是接口返回结构变了、还是登录态过期

  - id: exp.fake_green_sources_chronic
    name: 假绿体检：连续 7 天都「报成功却零产出」的来源数
    layer: experience
    db: supabase
    owner: crawler/run.py
    sql: >
      select count(*) from (
        select source_id from crawl_runs
        where started_at >= now() - interval '7 days'
        group by source_id
        having count(*) filter (where status = 'success' and jobs_found = 0) >= 7
           and count(*) filter (where not (status = 'success' and jobs_found = 0)) = 0
      ) chronic
    normal: "<= 10"
    severity: warn
    covers: []
    calibrated: false
    why: 一次假绿可能只是当天抖动，连续 7 天都这样基本可以确定这个来源已经坏了很久，只是没人发现。
    action: 把这条转给 Claude，让它逐个核实这些来源是不是真的失效了，失效的就先关掉（保留记录，不删）

  - id: exp.dead_click_signal_freshness_30d
    name: 「点开是死岗」这个埋点最近 30 天有没有再上报过
    layer: experience
    db: supabase
    owner: app/api/jobs/[jobId]/liveness/route.ts
    sql: >
      select count(*) from events
      where event = 'job_liveness_at_click' and created_at >= now() - interval '30 days'
    normal: ">= 1"
    severity: info    # 这个指标已知不可用，标 breach 也不该染灯，只留痕
    covers: []
    calibrated: false
    why: 实测这个埋点最后一次上报是 2026-09-04（全表只有 29 行：unknown 23 / alive 6 / dead 0），此后再没上报过。所以「点开是死岗」这项指标目前完全不可用——不是「死链变多了」，是这条埋点本身停了。
    action: 查 app/api/jobs/[jobId]/liveness/route.ts 的调用点最近有没有被下线或改了事件名

  - id: exp.dead_click_unknown_rate_alltime
    name: 点击时探活「查不出来」的比例（全量，非 7 天窗口；该指标当前不可用，仅留痕观察）
    layer: experience
    db: supabase
    owner: app/api/jobs/[jobId]/liveness/route.ts
    sql: >
      select count(*) filter (where payload->>'result' = 'unknown')::float
             / nullif(count(*), 0)
      from events
      where event = 'job_liveness_at_click'
    normal: "<= 1.01"
    severity: info    # 已知不可用（见 exp.dead_click_signal_freshness_30d），不该染灯
    covers: []
    calibrated: false
    why: 本来想用它衡量「点开是死岗」的比例，但实测全表 79%（23/29）都是 unknown（探不出结果）、且这条埋点 9 月 4 日后再没上报过——这个指标现在测不出真实死链率。改成全量窗口是因为 7 天窗口里这条埋点常年是空的，天天报「没查到」没有意义。上限故意设成 1.01，不让它触发告警——它还不到能报警的程度。
    action: 不要据此下结论；死链治理仍以 job-radar-clickable-job-criterion 的 last_seen_at 口径为准
  # ===== 链路层 =====
  # 每条对应一个「带 schedule cron 的定时 workflow」，回答的问题只有一个：
  # 「它在该出现的窗口里留下运行记录了吗」——不是「它跑对了没」（那是上面数据层的事）。
  # 窗口按各 workflow 自己的 cron 周期定（日更看昨天全天 Asia/Shanghai，每周任务看 8 天），
  # 全部在 2026-09-19 用真实生产 Supabase 库跑过 `select count(*) ...` 核对过数字。
  # module→workflow 的映射逐条读过对应 .py/.js 里的 `ops_runs.record_ops_run(...)` 调用点
  # 确认过，不是猜的；owner 指向真正写这个模块的 workflow 文件。

  - id: pipeline.daily_crawl_ran
