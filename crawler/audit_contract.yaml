  # ===== 老告警桥接（source: watchdog） =====
  # 这 16 条不是本文件自己跑 SQL 量出来的——它们的判定逻辑一直在 crawler/ops_watchdog.py 里跑
  # （规则 A~P，每天真评估、命中就开 GitHub Issue），本次只是把「今天这条规则命中了几条」接进
  # audit_results 这张趋势表，好让它们也能被晨报、能画历史曲线，不用再翻 Issue 列表。
  # 判定逻辑、阈值、evidence 文案一律不改；这里只补一层人话包装 + 桥接。
  # value = 这条规则本轮命中的 finding 数；normal 统一 "== 0"（命中即代表这类问题真实发生了）；
  # 规则本轮取数失败（比如取不到某张表）会落 verdict=error、value=NULL，不会被当成 0。

  - id: watchdog.rule_a
    name: 后台任务连续多天什么都没干出来
    layer: pipeline
    owner: crawler/ops_watchdog.py
    rule: A
    source: watchdog
    normal: "== 0"
    severity: critical
    calibrated: false
    why: 某个后台任务连续多天「有活可干却什么都没产出」，或者当天全部运行都失败了。空队列产出为 0 是正常的，只有「有活干却零产出」才算异常。
    action: 看是哪个模块命中，查它最近几次运行的日志

  - id: watchdog.rule_b
    name: 任务运行到一半被系统强制中断
    layer: pipeline
    owner: crawler/ops_watchdog.py
    rule: B
    source: watchdog
    normal: "== 0"
    severity: critical
    calibrated: false
    why: 按更细的执行步骤级状态判断（不是看整体任务状态，那样会漏），发现任务被系统强制杀掉，或者反复被取消。
    action: 看是哪个任务命中，把它的执行时长控制在系统允许的时限之内，或者拆小

  - id: watchdog.rule_c
    name: 派出去的活儿没人回写结果
    layer: pipeline
    owner: crawler/ops_watchdog.py
    rule: C
    source: watchdog
    normal: "== 0"
    severity: warn
    calibrated: false
    why: 有任务被派发出去处理，但超过几个小时都没有收到处理完成的回执，怀疑是卡住了。
    action: 看是哪条任务卡住，检查它有没有异常退出但没写回状态

  - id: watchdog.rule_d
    name: 账号或密钥出问题了
    layer: pipeline
    owner: crawler/ops_watchdog.py
    rule: D
    source: watchdog
    normal: "== 0"
    severity: critical
    calibrated: false
    why: 检测到账号欠费、密钥失效或者权限被拒绝这类问题——这种问题重试多少次都没用，必须去处理账号本身。
    action: 去对应服务商后台确认账号余额和密钥状态

  - id: watchdog.rule_e
    name: 该定时跑的关键任务超期没跑
    layer: pipeline
    owner: crawler/ops_watchdog.py
    rule: E
    source: watchdog
    normal: "== 0"
    severity: warn
    calibrated: false
    why: 某个声明了固定节奏的任务，超过它自己节奏两倍的时间还没有运行记录，怀疑触发失效了。
