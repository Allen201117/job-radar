name: auto-discover-overseas-sources

# ⏬ 2026-09-23 从每天降到每周一次（创始人拍板）：近 30 天每天探 80 家、共 2,400 次，0 产出——
# 剩下没覆盖的 189 家多是自建招聘站（Apple/TikTok/Nintendo…）或 Workday 站点名猜不到，天天探
# 结果都一样。每周仍整批探一遍（定时档 target_cap=200 覆盖全部缺口），兜住「有公司搬到
# greenhouse/lever/ashby/smartrecruiters 上」这种小概率。审计清单里本道的检查窗口同步改成 8 天。
on:
  schedule:
    - cron: "30 22 * * 0"   # 每周日 UTC 22:30（北京周一 06:30）
  workflow_dispatch:
    inputs:
      apply:
        description: "true=真入库；留空=dry-run 只数不插"
        required: false
        default: ""
      target_cap:
        description: "本次最多 probe 多少家缺失公司"
        required: false
        default: "80"
      insert_cap:
        description: "本次最多入库多少源"
        required: false
        default: "40"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AUTO_DISCOVER_OVERSEAS_TARGET_CAP: ${{ github.event.inputs.target_cap || '200' }}
      AUTO_DISCOVER_OVERSEAS_INSERT_CAP: ${{ github.event.inputs.insert_cap || '40' }}
      AUTO_DISCOVER_APPLY: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.apply }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crawler/requirements.txt
      - name: Install crawler dependencies
        run: pip install -r crawler/requirements.txt
      - name: Auto-discover overseas ATS sources
        run: python crawler/auto_discover_overseas.py
