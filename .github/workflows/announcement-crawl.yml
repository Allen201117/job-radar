name: announcement-crawl

# 公告制招聘：每日抓官方招聘公告（事业单位/体制内）→ announcement_postings（Supabase）+ 过期治理。
# 设计文档：docs/superpowers/specs/2026-09-15-announcement-recruitment-supply-design.md
# 归属门在 crawler/announcements/portals.py（只收官方 gov 域名 + 可报名公告）；扩省 = 往 PORTALS 加行。
# 只抓官方源，不碰公众号、不碰第三方平台（中公/华图等）——见方案 §2/§11。

on:
  schedule:
    - cron: "0 22 * * *"   # UTC 22（北京 6:00），与 daily-crawl(0:00)/auto-discover(23:00) 错峰
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true=只抓不写库（打印将入库的行）；留空=真抓 + 过期治理"
        required: false
        default: ""

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # 无结构化截止日时的兜底过期天数（发布日/首见日 + N 天）。改档改这里即可。
      ANNOUNCEMENT_TTL_DAYS: ${{ vars.ANNOUNCEMENT_TTL_DAYS || '45' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crawler/requirements.txt
      - name: Install crawler dependencies
        run: pip install -r crawler/requirements.txt
      - name: Harvest official recruitment announcements
        working-directory: crawler
        run: |
          if [ -n "${{ github.event.inputs.dry_run }}" ]; then
            python -m announcements.harvest --dry-run
          else
            python -m announcements.harvest
          fi

      # 国聘（国资委官方央企招聘平台）——补的是各省人社厅结构性够不着的那块：央企/地方国企。
      # 它是 JSON 接口、报名起止日是结构化字段，单独一个 harvester（见 announcements/iguopin.py）。
      - name: Harvest iguopin (SOE) announcements
        working-directory: crawler
        run: |
          if [ -n "${{ github.event.inputs.dry_run }}" ]; then
            python -m announcements.iguopin --dry-run
          else
            python -m announcements.iguopin
          fi

      # 每日复验：把**正在展示**的公告逐条真抓一遍正文，判它现在还能不能报，报不了就下架。
      # ⚠️ 入库时判一次是不够的：报名窗写在正文里，官方随时能另发公告提前关掉。
      # ⚠️ CI 在境外，够不着的省会被记 unreachable 跳过（不判死）；那些省由创始人 Mac 的 launchd 复验。
      - name: Re-verify displayed announcements
        if: ${{ github.event.inputs.dry_run == '' }}
        working-directory: crawler
        run: python -m announcements.verify
