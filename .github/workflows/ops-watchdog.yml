name: ops-watchdog

# 后台任务真产出告警：每天扫一遍 ops_runs 台账 + discovery_runs + events + workflow 运行历史，
# 把「静默坏掉」的任务开成本仓库的 GitHub Issue（防刷屏：同标题的 open issue 只追评论、不新开）。
# 规则与判据见 crawler/ops_watchdog.py 头注释 / docs/superpowers/specs/2026-08-27-observability-and-ux-plan.md §2.2。
#
# 时间：声明 UTC 00:30，**实际每天落在 UTC 05:05 前后**（= 北京 13:05）。
# ⚠️ 2026-09-23 纠错：原注释写「每日北京 08:30 …… 赶在 09:00 的自动修复 session 之前」，
#    这条从来没成立过——本仓 UTC 00 时段实测中位延迟 306 分钟（12 个样本，275~322），
#    GitHub 把它推到了北京 13:05。排在夜间档之后、看到完整一夜产出这点仍然成立（判定口径没变），
#    但「赶在 09:00 之前」是错的，别再照着这句话推断桥接数据是新鲜的。
# 📌 因此 audit_results 里那 16 条老告警的**当天数值不靠这条 cron**：structural-audit.yml
#    自己会先 dry-run 跑一遍 ops_watchdog 把桥接写上（见那边「Refresh watchdog bridge」一步的注释），
#    本条链跑到时再按 (check_id, run_date) upsert 覆盖成更新的值。
#
# ⚠️ 默认 dry-run：只在日志里打印「会开哪些 issue」，零写入。要真开 issue，
# 到 repo → Settings → Variables 加 OPS_WATCHDOG_APPLY=true（或手动 dispatch 时把 apply 填 true）。
# 这样开关不用改代码，也不会因为某次误判就往仓库里灌一堆 issue。
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "true=真开 issue / false=只打印；留空则跟随 repo 变量 OPS_WATCHDOG_APPLY"
        required: false
        # ⚠️ 默认必须留空：GitHub 表达式里非空字符串一律为真，default:"false" 会让下面的
        # `inputs.apply || vars.OPS_WATCHDOG_APPLY` 永远短路成 "false"，手动触发时无声吃掉 repo 变量
        # （2026-08-28 实测：变量已设 true，手动跑出来仍是 dry-run、一条 issue 都不开）。
        default: ""
      days:
        description: "规则 A：连续几天零产出才告警"
        required: false
        default: "2"

permissions:
  contents: read
  actions: read      # 规则 B/E 要读 workflow 运行与 job 详情
  issues: write      # 告警出口

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # 直连 Postgres（不是 supabase-py 客户端）：2026-09-19 起本任务把老告警规则的结果桥接进
      # audit_results 表（crawler/audit_runner.py 用 psycopg2 直连写库），这条与 structural-audit.yml
      # 用的是同一个 secret。桥接写失败只打 ::warning::，缺这个变量不会让告警发布本身失败。
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPS_WATCHDOG_APPLY: ${{ github.event.inputs.apply || vars.OPS_WATCHDOG_APPLY || 'false' }}
      # 已知在停摆、不想被反复提醒的模块（逗号分隔）。留空即全查。
      OPS_WATCHDOG_MUTE_MODULES: ${{ vars.OPS_WATCHDOG_MUTE_MODULES }}
      # 规则 K（adapter 产出骤降）/ L（源断抓）已知在修、不想被反复提醒的 adapter（逗号分隔，如 moka）。留空即全查。
      OPS_WATCHDOG_MUTE_ADAPTERS: ${{ vars.OPS_WATCHDOG_MUTE_ADAPTERS }}
      DISPATCH_DAYS: ${{ github.event.inputs.days || '2' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crawler/requirements.txt

      - name: Install crawler dependencies
        run: pip install -r crawler/requirements.txt

      - name: Run ops watchdog
        shell: bash
        run: python3 crawler/ops_watchdog.py --days "$DISPATCH_DAYS"
