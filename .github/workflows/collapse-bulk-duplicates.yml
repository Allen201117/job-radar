name: collapse-bulk-duplicates

# 批量门店发布源的**存量**去重：同一个「角色 × 城市」只留一条，其余标 removed（可逆，purge 不删）。
# 新增侧由 adapters/base.RepetitionBrake 止住；这条 workflow 清的是刹车装上之前已经灌进去的存量。
#
# 手动触发、默认 dry-run、**必须点名公司**——不提供一键全清。理由见
# crawler/collapse_bulk_duplicates.py 的模块注释（重复率高有两种成因，处置完全相反）。

on:
  workflow_dispatch:
    inputs:
      company:
        description: "公司名子串，多家用逗号分隔（如：星巴克,来伊份,喜茶）"
        required: true
      apply:
        description: "true = 真的写库；留空/false = 只 dry-run 报数"
        required: false
        default: "false"

jobs:
  collapse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - run: pip install -r crawler/requirements.txt

      - name: Collapse bulk duplicates
        env:
          JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
          JOBS_DATABASE_SSL_CA: ${{ secrets.JOBS_DATABASE_SSL_CA }}
          JOBS_DATABASE_TLS_SERVERNAME: ${{ secrets.JOBS_DATABASE_TLS_SERVERNAME }}
        run: |
          set -euo pipefail
          args=()
          IFS=',' read -ra names <<< "${{ github.event.inputs.company }}"
          for n in "${names[@]}"; do
            trimmed="$(echo "$n" | xargs)"
            [ -n "$trimmed" ] && args+=(--company "$trimmed")
          done
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then args+=(--apply); fi
          python3 crawler/collapse_bulk_duplicates.py "${args[@]}"
