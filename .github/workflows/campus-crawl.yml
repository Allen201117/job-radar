name: campus-crawl

# 校招高频车道（2027 届秋招正式批基座）。
#
# 为什么要单独一条车道：校招公司**一次性放出全部岗位**——开闸即从几十跳到几百上千。
# daily-crawl 每 6 小时一轮、enrich-crawl 每天一轮，最坏要等一天才进库，而秋招前几天的
# 曝光窗口最值钱。本车道把「必投清单里的校招源」（几十个）单独拎出来每小时刷一遍，
# 并在检测到开闸时**立刻再抓一遍**不等下一个整点。
#
# 与主链路的关系：这是**叠加的加密轮次**，daily-crawl / enrich-crawl 覆盖面一行不减。
# 选源 = sources.board ∈ {campus,mixed} ∪ 近 30 天真产过校招岗的源，交必投清单
# （并集不可省：live 实测 430 个真产校招岗的源里 board 只覆盖 281，漏的全是比亚迪/小红书/
#  华为/蚂蚁这类把校招社招混在一个列表里的自建门户）。
#
# 淡季由脚本内 is_campus_season 判月份早退（秋招 8-11 月 / 春招 2-4 月），
# 不删 cron 是为了随时能 workflow_dispatch 手动跑；强跑设 force=true。

on:
  schedule:
    # 每 20 分钟触发，但**实际每小时才真跑一轮** —— 多出来的由 gate job 挡回去。
    #
    # 为什么不老老实实写 "20 * * * *"：GitHub 在平台高负载时会静默丢弃 schedule 触发，
    # 高频 cron 尤甚。2026-08-07 实测老写法只跑出 ~7 次/天、相邻两轮平均间隔 171 分钟
    # —— 车道真实节奏只有设计值的 1/3，秋招开闸最坏要等 3 小时才被发现。
    # 已排除另两种解释：每轮只跑 8-9 分钟不存在堵塞；23 个 run 里 0 个 cancelled，
    # 不是 concurrency 把排队的顶掉。剩下就是 GitHub 官方文档写明的「高负载时跳过」。
    # 加密到每 20 分钟后：丢了触发有富余的补上，没丢触发也不会真去轰目标站点三遍。
    #
    # 🚫 改 cron 前先看下面的 gate job —— 拿掉那道闸就会真的每 20 分钟抓一遍。
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "淡季也强制跑一轮（true/false）"
        required: false
        default: "false"

concurrency:
  # 上一轮没跑完就别叠下一轮——同一批源被两个 runner 并发轰容易触发目标站点限流。
  group: campus-crawl
  cancel-in-progress: false

jobs:
  # 频率闸：上面的 cron 是「每 20 分钟触发」，这道闸把节奏拉回「每小时真跑一轮」。
  # 刻意做成独立的轻量 job（不 checkout 依赖、不装 chromium，整轮 ~10 秒）——
  # 判「不该跑」的轮次不该花 2-3 分钟装环境。crawler/campus_lane_gate.py 因此只用标准库。
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.check.outputs.due }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CAMPUS_LANE_FORCE: ${{ github.event.inputs.force }}
      # GITHUB_EVENT_NAME 不在这里设 —— Actions 默认就注入它，且 GITHUB_ 是保留前缀。
    steps:
      - uses: actions/checkout@v4
      # gate 只用标准库（campus_lane_gate.py + campus_lane.py 均无三方依赖），直接用 runner
      # 自带 python3——这个 job 每 20 分钟跑一次，setup-python 每天 72 次纯开销（2026-08-28 去掉）。
      - id: check
        name: 该不该跑（距上轮真跑完 ≥50min / 校招季 / 手动触发一律放行）
        run: python3 campus_lane_gate.py
        working-directory: crawler

  campus-lane:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    # 车道只抓几十个源；给 50min 是为了容纳开闸当轮的「加急重抓」第二遍（可能上千岗要 upsert）。
    timeout-minutes: 50
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # ⚠️ 忘配这三个 = 静默写空库（见记忆 job-radar-phase1-ci-jobs-db-wiring）。
      # 本车道更严：campus_crawl.main() 在未配 JOBS_DATABASE_URL 时直接非零退出，
      # 因为开闸检测必须回读香港 jobs 库，静默降级会造成「CI 绿灯但检测从没跑过」的假象。
      JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
      JOBS_DATABASE_SSL_CA: ${{ secrets.JOBS_DATABASE_SSL_CA }}
      JOBS_DATABASE_TLS_SERVERNAME: ${{ secrets.JOBS_DATABASE_TLS_SERVERNAME }}
      CAMPUS_LANE_FORCE: ${{ github.event.inputs.force }}
      # 车道源少，并发可以给足；同主机仍由 run.py 的主机队列串行护着，不会打爆单站。
      CRAWL_CONCURRENCY: "8"
      # 车道只负责「把新放出来的岗尽快抓进来」，逐岗富化交给 enrich-backlog 按自己的节奏做。
      CRAWL_DETAIL_CAP: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crawler/requirements.txt

      - name: Install crawler dependencies
        run: pip install -r crawler/requirements.txt

      # 常规每小时轮次只跑 httpx 档，用不到 chromium；但**开闸后的加急重抓**走 tier=all，
      # 那一下可能撞上浏览器源。开闸是随时可能发生、且最不能错过的一刻，不能等下一轮再装浏览器，
      # 所以每轮都预装（公开仓库 Actions 分钟无限，~1min 的固定开销换开闸当场就能重抓，值）。
      - name: Install Playwright browser (for surge re-crawl)
        run: python -m playwright install --with-deps chromium

      - name: Run campus lane (select → crawl → detect surge → re-crawl)
        run: python crawler/campus_crawl.py
        working-directory: ${{ github.workspace }}
