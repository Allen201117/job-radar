# 用户体验走查：拿真实用户画像逐个模拟（推荐有没有岗 / 方向准不准 / 洞察有没有 / 校招专区可用度 / 接口 TTFB），
# 每天一轮写 ops_runs(module=ux_walkthrough)。只读，不写任何用户数据。脚本与口径见 scripts/ux-walkthrough/walkthrough.js。
name: ux-walkthrough

on:
  schedule:
    - cron: "10 4 * * *"   # UTC 04:10 = 北京 12:10，日抓取与富化都跑完之后
  workflow_dispatch:

jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
      JOBS_DATABASE_SSL_CA: ${{ secrets.JOBS_DATABASE_SSL_CA }}
      JOBS_DATABASE_TLS_SERVERNAME: ${{ secrets.JOBS_DATABASE_TLS_SERVERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # ⚠️ 不用 `npm ci`：仓库 lock 与 package.json 在 Linux runner 上不同步 —— npm ci 是严格模式，
      # 实测 2026-09-18 直接失败并中断整条链（`Missing: @emnapi/runtime@1.11.3 from lock file`，
      # @emnapi 是 Linux 平台特有的 optional 依赖，在 macOS 上跑 npm install 补不出来，
      # 所以本地看 lockfile 永远是「同步」的）。backfill-job-function / backfill-recruitment-category
      # 两条链早就因为同一个原因绕开了 npm ci，这条链是后加的，踩了同一个坑。
      # npm install 是非严格模式，会按 runner 的平台自己补齐；CI 里改到的 lockfile 不提交，无副作用。
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Walk through real user profiles
        run: node scripts/ux-walkthrough/walkthrough.js --record
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-walkthrough-raw
          path: scripts/ux-walkthrough/walkthrough-raw.json
          retention-days: 14
