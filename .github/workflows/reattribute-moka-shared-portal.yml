name: reattribute-moka-shared-portal

# Moka「一个门户发多家公司的岗」的存量归属纠正：逐行按标题末尾的业务段改 company。
# rename-job-company 按 jd_url 前缀整批改名，同一前缀下两家混着时用不上，才有这条（北森那边是 reattribute-beisen-shared-tenant）。
# 判据与护栏见 crawler/reattribute_moka_shared_portal.py 的模块注释。手动触发、默认 dry-run。
# ⚠️ 改名的行招聘类型分类会被清空等重算：apply 之后立刻手动触发 backfill-recruitment-category，再触发 insight-subjects。

on:
  workflow_dispatch:
    inputs:
      url_prefix:
        description: "门户页地址（= 岗位链接里 # 之前的部分），须已登记在 _MOKA_SHARED_PORTALS"
        required: true
        default: "https://app.mokahr.com/campus-recruitment/crland/168540"
      mode:
        description: "dry-run = 只报数 / rehearse = 真执行后回滚 / apply = 真写"
        type: choice
        options: ["dry-run", "rehearse", "apply"]
        default: "dry-run"
      allow_in_flight:
        description: "true = 有抓取在跑也执行（只在确认在飞的轮次都晚于 adapter 改动进 main 时用）"
        required: false
        default: "false"

concurrency:
  group: reattribute-moka-shared-portal
  cancel-in-progress: false

jobs:
  reattribute:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - run: pip install -r crawler/requirements.txt

      - name: Reattribute shared portal
        env:
          JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
          JOBS_DATABASE_SSL_CA: ${{ secrets.JOBS_DATABASE_SSL_CA }}
          JOBS_DATABASE_TLS_SERVERNAME: ${{ secrets.JOBS_DATABASE_TLS_SERVERNAME }}
          # rehearse / apply 要回读 sources / crawl_runs（本家名对不对、有没有抓取在飞），所以需要 Supabase。
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          URL_PREFIX: ${{ github.event.inputs.url_prefix }}
          MODE: ${{ github.event.inputs.mode }}
          ALLOW_IN_FLIGHT: ${{ github.event.inputs.allow_in_flight }}
        run: |
          set -euo pipefail
          args=(--url-prefix "$URL_PREFIX")
          if [ "$MODE" = "rehearse" ]; then args+=(--rehearse); fi
          if [ "$MODE" = "apply" ]; then args+=(--apply); fi
          if [ "$ALLOW_IN_FLIGHT" = "true" ]; then args+=(--allow-in-flight); fi
          python3 crawler/reattribute_moka_shared_portal.py "${args[@]}"
