name: campus-board-probe

# 校招板块批量补源（取代逐家手工啃自建门户）。
#
# 为什么这条流水线存在：库里 94% 的源是通用 ATS 平台，平台的校招板块 URL 是模板化的
# → 可批量推导 + 批量探。实测手工 2 小时打通 2 家，批量分诊 20 秒扫完 152 个候选命中 140。
#
# 两个 job 串行：
#   probe  —— 层1 廉价分诊（httpx 秒级）：候选推导 → robots 门 → 可达且像真板块 → 插 disabled 源
#   verify —— 层2 昂贵验收（可能跑浏览器 adapter）：真抓 → 非重复门 → 健康岗 ≥1 → 才 enable
#
# ⚠️ 手动触发仍默认 dry-run，只有带 apply=true 才写库；定时触发走 apply。
# 原先担心无人值守会新增不合格源，但四轮生产实测证明验收门足够硬：38 个候选通过 15 个
# （真抓到健康岗才 enable），23 个被拒且源连同脏岗一并删除，没有一个不合格的源留在库里。
# 不自动跑的代价是实打实的：2026-08-04 建成后手动跑 3 次就停摆，101 个 moka 候选在库外躺了三天，
# 正撞上秋招开闸期。安全边界不变：层2 验收门（真抓 → 非重复门 → 健康岗 ≥1）仍是唯一的 enable 途径。

on:
  schedule:
    # 每日 UTC 16:00（北京时间次日 00:00）。verify 最坏跑到 17:30，整段落在空窗里；
    # daily-crawl 的 13:00 轮已结束、17:00 轮尚未开始。完整避开 20:00–23:00 浏览器重档带：
    # enrich-backlog-browser(20:00)、auto-discover-browser(21:00)、dead-link-audit(22:00)。
    # 三档与本流水线抓同一批 moka 租户，错开可同时避免抢 runner 与触发站点限流；也不撞
    # harvest-beisen-routes(19:00) 和 insight-staleness-sweep(19:30)。
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "true = 真写库（插 disabled 候选源）；缺省 dry-run 只报告"
        required: false
        default: "false"
      probe_limit:
        description: "层1 本轮处理多少个候选（0 = 不限）"
        required: false
        default: "40"
      verify_limit:
        description: "层2 本轮验收几个，0 = 不限（moka 是浏览器源 2-5min/个，90min 超时下别超过 20）"
        required: false
        default: "12"

concurrency:
  group: campus-board-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
      JOBS_DATABASE_SSL_CA: ${{ secrets.JOBS_DATABASE_SSL_CA }}
      JOBS_DATABASE_TLS_SERVERNAME: ${{ secrets.JOBS_DATABASE_TLS_SERVERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r crawler/requirements.txt
      - name: Layer 1 — triage campus board candidates
        run: |
          python crawler/campus_board_probe_run.py \
            --limit "${{ github.event.inputs.probe_limit || '40' }}" \
            ${{ (github.event_name == 'schedule' || github.event.inputs.apply == 'true') && '--apply' || '' }}

  verify:
    needs: probe
    if: ${{ github.event_name == 'schedule' || github.event.inputs.apply == 'true' }}
    runs-on: ubuntu-latest
    # 层2 可能跑 moka 浏览器 adapter（2-5min/源）；12 个 ≈ 25-60min，留足余量。
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
      JOBS_DATABASE_SSL_CA: ${{ secrets.JOBS_DATABASE_SSL_CA }}
      JOBS_DATABASE_TLS_SERVERNAME: ${{ secrets.JOBS_DATABASE_TLS_SERVERNAME }}
      CRAWL_DETAIL_CAP: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r crawler/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Layer 2 — acceptance gate (crawl → anti-duplicate → healthy jobs)
        run: python crawler/campus_board_verify.py --limit "${{ github.event.inputs.verify_limit || '12' }}"
