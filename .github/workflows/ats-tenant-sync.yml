name: sync-ats-tenants

on:
  schedule:
    # 每周一 UTC 05:30，避开整点抓取和晚间浏览器重档。
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crawler/requirements.txt
      # ⚠️ 这一步不是可有可无的（2026-09-23 补，此前一直漏着）：
      #   同步本身只用标准库（urllib），装不装依赖都跑得通；但跑完要写 ops_runs 台账，
      #   那条路径走 crawler/db.py → import httpx。没装依赖 → 台账写不进去，
      #   而写台账的失败是被 try 兜住的（「不影响主流程」），于是每周都是：
      #   **同步真的成功了，体检却一直显示这条任务没跑过**。
      #   实测 09-21 那次：三份名单 198/221/8 全部同步成功，日志里同时有
      #   `ops_runs 台账写入失败（不影响主流程）: No module named 'httpx'`。
      - name: Install crawler dependencies
        run: pip install -r crawler/requirements.txt
      - name: Sync ATS tenant snapshots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 crawler/sync_ats_tenants.py --apply
      - name: Commit updated snapshots if changed
        run: |
          if ! git diff --quiet -- crawler/data/ats_tenants; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add crawler/data/ats_tenants
            git commit -m "chore(crawler): 同步 ATS 租户快照 [skip ci]"
            git push origin HEAD:main
            echo "tenant snapshots committed."
          else
            echo "no tenant snapshot changes."
          fi
