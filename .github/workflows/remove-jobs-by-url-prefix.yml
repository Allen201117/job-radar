name: remove-jobs-by-url-prefix

# 停用影子门户源之后，把它名下的 active 岗标 removed（可逆，purge 不删）：按 jd_url 前缀 + 公司名点名。
# 配套 sources 的 disable 迁移一起用（如 275：特变电工 wt 老门户）。手动触发、默认 dry-run。
# 取舍与护栏见 crawler/remove_jobs_by_url_prefix.py 的模块注释。

on:
  workflow_dispatch:
    inputs:
      url_prefix:
        description: "jd_url 前缀（门户级，完整 https 前缀）"
        required: true
      company:
        description: "精确公司名，与前缀同时成立才动"
        required: true
      only_twins_under:
        description: "可选：保留门户的 jd_url 前缀，只标在它下面有在招孪生行（同一 # 片段）的岗"
        required: false
        default: ""
      apply:
        description: "true = 真的写库；留空/false = 只 dry-run 报数"
        required: false
        default: "false"

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - run: pip install -r crawler/requirements.txt

      - name: Remove jobs under portal prefix
        env:
          JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
          JOBS_DATABASE_SSL_CA: ${{ secrets.JOBS_DATABASE_SSL_CA }}
          JOBS_DATABASE_TLS_SERVERNAME: ${{ secrets.JOBS_DATABASE_TLS_SERVERNAME }}
          URL_PREFIX: ${{ github.event.inputs.url_prefix }}
          COMPANY: ${{ github.event.inputs.company }}
          ONLY_TWINS_UNDER: ${{ github.event.inputs.only_twins_under }}
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          set -euo pipefail
          args=(--url-prefix "$URL_PREFIX" --company "$COMPANY")
          if [ -n "$ONLY_TWINS_UNDER" ]; then args+=(--only-twins-under "$ONLY_TWINS_UNDER"); fi
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          python3 crawler/remove_jobs_by_url_prefix.py "${args[@]}"
