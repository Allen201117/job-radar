name: campus-official-pages
# 校招今年精确日期 快路②（P3b）：每日 cron 对必投公司「官方校招页 httpx 并发直取」→
# campus_official_extract 抽精确网申/截止日期 → insight_engine 判官 → official_gate 官方源门
# auto-verify → 幂等写 recruitment_cycle_observations（time_expr_type='精确日期'/'日期范围'）。
# 红线（宁缺不编）：只 auto-verify「官方招聘域名 grounding（抓的就是公司自有官方页）+ 判官
# entailment」的精确日期；SPA 空壳/无日期信号/往年过期日期一律诚实跳过。
# 不吃搜索额度（全程 httpx 抓公开官方页，不调 search_router）。
# 依赖：迁移 182 已应用；只需 SILICONFLOW_API_KEY（抽取+判官）+ Supabase（sources/画像/RCO）。
# 与 campus-cycle-enrich(22:15)/insight-enrich(20:30)/insight-enrich-t3(21:30) 错峰到 20:00。

on:
  # ⏸️ 2026-08-27 暂停定时（创始人决定，待充值后恢复）：抽取与判官全靠 LLM，
  # SiliconFlow 余额耗尽（HTTP 402）期间整轮写入 0 条。本管线不吃搜索额度，
  # 但空跑没有意义。恢复方法：账户充值后取消下面两行注释。
  # ▶️ 2026-08-28 恢复定时：暂停原因（账户欠费 + 太贵）两条都已解除——
  #   ① 创始人已充值，手动跑一轮确认无 402；
  #   ② 成本砍到约 1/6（换 Qwen3-30B / 去 Pro 前缀 / T3 主题 5→3 / writer 喂 8 条 / judge 前引文预筛），
  #      且补上了以前根本没有的 **LLM 日顶硬闸**（llm_budget，默认 250 次/天）与**用量记账**。
  #   想再暂停：把下面 schedule 两行重新注释掉即可。
  # ⏸️ 2026-09-21 再次停掉定时（创始人拍板），这次不是钱的问题，是**这条链的取数方式够不着目标**：
  #   · 上线至今只产出过 1 条数据（recruitment_cycle_observations 里 source_kind='official_notice'
  #     全表 1 行，2026-09-05）。已覆盖的 25 家公司全是 campus-cycle-enrich（公开信息搜索那条链）补的。
  #   · 2026-09-21 对**全部 304 家未覆盖**的必投公司跑了本链的前两道门（只抓页面、不调 LLM、不写库）：
  #     没有自有官网 208 家（库里无源 79 / 源全在 Moka·北森·飞书等共享平台上 129——按防张冠李戴规则
  #     这些域名不能冒充公司官网，门不能放宽）；有官网但页面无日期信号 90 家（拿去当「校招公告页」的
  #     其实是爬岗位用的**岗位列表页**，JS 渲染、本来就不写网申日期）；能过两道门的只有 6 家，
  #     其中 4 家过门靠的是岗位列表接口里的发帖日，不是网申日期。而且这是国内网络测的，CI 在美国只会更少。
  #   · 每晚空跑、每晚报「连续零产出」（issue #7 拖了 23 天），把真告警埋在里面。
  #   · 顺带发现：目标固定取必投清单「未覆盖的前 40 家」且顺序不变 → 后 264 家从没被试过；
  #     但按上面的量尺，修轮转最多多出 1~2 家，不构成恢复定时的理由。
  #   想恢复：先给「校招网申日期」找到够得着的取数来源（例如库里官方 ATS 校招岗自带的投递截止日——
  #   2026-09-21 量过能覆盖未覆盖公司里的 46 家，但各平台截止日含义不一，要逐个核），再取消下面两行注释，
  #   并把 audit_contract.yaml 里 pipeline.campus_official_pages_ran 加回去。
  # schedule:
  # - cron: "20 20 * * *"   # 每日 UTC 20:20（2026-08-28 与 enrich-backlog-browser 的 20:00 真正错开）
  workflow_dispatch:
    inputs:
      company:
        description: "只跑单家公司（调试用；留空=批量必投公司）"
        required: false
        default: ""
      limit:
        description: "批量模式：本轮最多处理多少家公司"
        required: false
        default: "40"

jobs:
  campus-official-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crawler/requirements.txt

      - name: Install crawler dependencies
        run: pip install -r crawler/requirements.txt

      - name: Drain campus official pages (快路②)
        working-directory: crawler
        run: |
          if [ -n "${{ github.event.inputs.company }}" ]; then
            python3 campus_official_backlog.py --company "${{ github.event.inputs.company }}"
          else
            python3 campus_official_backlog.py --limit "${{ github.event.inputs.limit || '40' }}" --workers 6
          fi
