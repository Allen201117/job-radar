name: audit-hotjob-attribution

# 复核 enabled 的 wecruit（hotjob）源：sources.company 与租户自报 suite/config.companyName 对不上就打 ::warning::。
# 只读，不写库。起因见 crawler/audit_hotjob_attribution.py 模块注释（248 精雕/京东、274 特变/领益两次张冠李戴）。
# 本机 LibreSSL 连不上 hotjob.cn，所以在 runner 上跑。手动触发 + 每周一次。

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "只查前 N 条源（留空=全部）"
        required: false
        default: ""
  schedule:
    - cron: "17 22 * * 1"   # 每周一 UTC 22:17（错开每日爬取档）

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - run: pip install -r crawler/requirements.txt

      - name: Audit hotjob attribution
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${LIMIT:-}" ]; then args+=(--limit "$LIMIT"); fi
          python3 crawler/audit_hotjob_attribution.py "${args[@]}"
