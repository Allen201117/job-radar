name: production-smoke

# 生产冒烟：首页能开 + /api/jobs/stats 的公开聚合契约还在。
#
# ⚠️ 2026-08-27 补 schedule：此前只有 workflow_dispatch，最后一次运行停在 2026-07-11（47 天）——
# 有冒烟测试但是死的，等于没有。每日 UTC 04:00 跑一次（排在 db-report 03:30 之后，互不打架）。
# 定时触发时 inputs 为空，必须给 BASE_URL 兜个默认值，否则 curl 会去请求空字符串。
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Production origin to verify"
        required: false
        default: "https://www.myjobradar.top"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public pages and jobs database stats
        id: smoke
        env:
          BASE_URL: ${{ inputs.base_url || 'https://www.myjobradar.top' }}
        run: |
          set -euo pipefail
          base="${BASE_URL%/}"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --max-time 30 --output /dev/null "$base/"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --max-time 35 --output "$RUNNER_TEMP/jobs-stats.json" "$base/api/jobs/stats"
          result="$(node - "$RUNNER_TEMP/jobs-stats.json" <<'NODE'
          const fs = require("node:fs");
          const body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (
            body.ok !== true ||
            !Number.isFinite(body.validActive) ||
            !Number.isFinite(body.recent24h) ||
            !Number.isFinite(body.sources)
          ) {
            throw new Error("jobs stats response failed its public aggregate contract");
          }
          console.log(JSON.stringify({
            ok: body.ok,
            validActive: body.validActive,
            recent24h: body.recent24h,
            sources: body.sources,
          }));
          NODE
          )"
          echo "$result"
          echo "metrics=$result" >> "$GITHUB_OUTPUT"

      - name: Record ops_runs ledger
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # 台账是旁路观测：写失败只告警，绝不让 smoke 这个 job 因此变红。
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::warning::SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY 未配置，跳过 ops_runs 台账写入"
            exit 0
          fi
          status="failed"
          [ "${{ steps.smoke.outcome }}" = "success" ] && status="success"
          metrics='${{ steps.smoke.outputs.metrics }}'
          [ -n "$metrics" ] || metrics='{}'
          now="$(date -u +%FT%TZ)"
          # run_date 按上海时区取日（不用裸 `date -u`），理由同 db-report.yml 那条注释。
          payload=$(printf '{"module":"production_smoke","run_date":"%s","status":"%s","started_at":"%s","finished_at":"%s","metrics":%s}' \
            "$(TZ=Asia/Shanghai date +%F)" "$status" "$now" "$now" "$metrics")
          curl -sS --max-time 15 -X POST "$SUPABASE_URL/rest/v1/ops_runs" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "$payload" \
            || echo "::warning::production-smoke ops_runs 台账写入失败（不影响本次冒烟结果）"
