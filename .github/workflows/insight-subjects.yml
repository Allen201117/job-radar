name: insight-subjects

# 洞察主体（公司 × 业务线）抽取 + 业务线级信号派生。
# ⚠️ 这条链是 insight_subjects / 结构化 signal 条目的**唯一**写入方。
#    2026-09-03 接手时发现 crawler/bu_extract.py 写完却没有任何 workflow 调它，
#    生产库 insight_subjects 是 0 行 —— 抽取器不接线 = 没上线。
# 排期：22:10 UTC，与 20:50 年报、21:00 auto-discover-browser、22:40 gap-funnel 错开。
on:
  schedule:
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      company:
        description: "只处理单家公司（抽取按 jobs.company、派生按 company_profiles.company，通常同名；留空=全部）"
        required: false
        default: ""
      limit:
        description: "最多处理多少家公司（0=全部）"
        required: false
        default: "0"
      dry_run:
        description: "只打印抽取/派生结果，不写库"
        required: false
        default: "false"
      skip_extract:
        description: "跳过主体抽取，只跑信号派生"
        required: false
        default: "false"

concurrency:
  # 两步共享 insight_subjects / insight_items，串行跑，避免上一轮没写完下一轮就读。
  group: insight-subjects
  cancel-in-progress: false

jobs:
  subjects:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # jobs 热表在自建香港 PG；不注入这三个，jobs_db 会回退到空的 Supabase jobs 表，
      # 抽取与派生都会「跑绿零产出」（本仓库栽过多次，见 CLAUDE.md「Phase1 CI 接线坑」）。
      JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
      JOBS_DATABASE_SSL_CA: ${{ secrets.JOBS_DATABASE_SSL_CA }}
      JOBS_DATABASE_TLS_SERVERNAME: ${{ secrets.JOBS_DATABASE_TLS_SERVERNAME }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 职能分布走 scripts/classify-job-function.js（权威词表在 JS，不翻译成 Python）。
      # 没有 node 时派生层会弃权、不产出 function_share，不会静默按「其他」算。
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install crawler dependencies
        run: pip install -r crawler/requirements.txt

      - name: Extract insight subjects (company × business unit)
        if: ${{ github.event.inputs.skip_extract != 'true' }}
        working-directory: crawler
        env:
          # 没有画像的公司整家进不了洞察库（画像是 insight_subjects 的外键父表）。
          # live 实测 1,985 家有在招岗的公司里只有 976 家有画像。新画像带
          # insight_checked_at，不会插到用户关心的公司前面去抢富化预算。
          BU_CREATE_PROFILES: "true"
          INPUT_COMPANY: ${{ github.event.inputs.company }}
          INPUT_LIMIT: ${{ github.event.inputs.limit || '0' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          ARGS=(--limit "$INPUT_LIMIT")
          if [ -n "$INPUT_COMPANY" ]; then ARGS+=(--company "$INPUT_COMPANY"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python3 bu_extract.py "${ARGS[@]}"

      - name: Derive business-unit level signals
        working-directory: crawler
        env:
          INPUT_COMPANY: ${{ github.event.inputs.company }}
          INPUT_LIMIT: ${{ github.event.inputs.limit || '0' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          ARGS=(--limit "$INPUT_LIMIT")
          if [ -n "$INPUT_COMPANY" ]; then ARGS+=(--company "$INPUT_COMPANY"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python3 bu_signals.py "${ARGS[@]}"
