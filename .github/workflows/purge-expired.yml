name: purge-expired

# 方针（2026-06-18 定）：expired 死岗 = sweep/dead-link-audit 逐岗探活**确认撤岗**（404 / hotjob state=1017 /
# wt req_state=9501 / SPA dead marker）→ **永久删除、不保留**，持续回收空间，防 expired 物理累积把库撑过 500MB。
#   · 只删 status='expired'（确认死）；status='removed'（抓取漏看、可复活）保留不动。
#   · job_actions.job_id ON DELETE CASCADE 连带删（用户对已撤岗的收藏本就无意义）。
#   · DELETE + 普通 VACUUM(ANALYZE)：释放行空间进表内空闲列表供新岗复用 + 刷新统计；**不每日 VACUUM FULL**
#     （避免每日锁表）。db_size 真正还盘缩小由 maintenance-vacuum -f full=true 按需手动跑（删大批后）。
# 用 JOBS_DATABASE_URL secret（自建香港 jobs 库；jobs 已迁过去，expired 死岗在那儿）。psql 自动逐句提交故 VACUUM 可跑。

on:
  schedule:
    - cron: "30 2 * * *"   # 每日 UTC 02:30，错开 daily-crawl(0:00)/purge 与抓取/巡检
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    # 2026-08-28：此前无超时=默认 360min，08-18 实锤跑满 6h 被硬杀。日常 ~20min，45 兜底。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Purge expired jobs + vacuum
        env:
          JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
          JOBS_DATABASE_SSL_CA: ${{ secrets.JOBS_DATABASE_SSL_CA }}
          JOBS_DATABASE_TLS_SERVERNAME: ${{ secrets.JOBS_DATABASE_TLS_SERVERNAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${JOBS_DATABASE_URL:-}" ]; then
            echo "::error::JOBS_DATABASE_URL secret 未配置（与 db-migrate 同一个）。"
            exit 1
          fi
          source scripts/enable-jobs-db-strict-tls.sh
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # ⚠️ 墓碑与删除**必须同一事务**（2026-09-08 加，修 F1）：先把「这个岗曾被确认关闭」写进
          # job_closures，再删 jobs 行；墓碑写失败就整体回滚、一行都不删。
          # 「删了但没留下证据」正是死岗以全新 uuid 复活的成因——jobs 行没了，按 canonical 查不到任何
          # 东西，下次列表再见到同一个链接就走 fresh INSERT 变回 active（近 14 天实测均值 2,871 行/天）。
          # 🔑 单个 -c 里的多条语句 psql 会**当成一个事务**执行（无显式 BEGIN 时的默认行为）。
          #    别把它拆成两个 -c —— 那就是两个独立事务，前一个成功后一个失败照样留下不一致。
          # 排除「同 canonical 还有 active 行」：canonical 唯一约束只作用于 active，已关闭的旧行与
          # 在招的新行可以并存，给它立墓碑会把一个在招岗记成已关闭。
          deleted_count="$(
            PGOPTIONS="-c statement_timeout=1800000" \
            psql "$JOBS_DATABASE_URL" -v ON_ERROR_STOP=1 -qAt -c "
              insert into job_closures (
                canonical_jd_url, job_id, source_id, company, title, first_seen_at, closed_at, reason)
              select j.canonical_jd_url, j.id, j.source_id, j.company, j.title, j.first_seen_at,
                     coalesce(j.confirmed_closed_at, now()), 'purge_expired'
              from jobs j
              where j.status = 'expired'
                and j.canonical_jd_url is not null
                and not exists (select 1 from jobs a
                                where a.canonical_jd_url = j.canonical_jd_url and a.status = 'active')
              on conflict (canonical_jd_url) do update set
                job_id        = excluded.job_id,
                source_id     = excluded.source_id,
                company       = excluded.company,
                title         = excluded.title,
                first_seen_at = excluded.first_seen_at,
                closed_at     = excluded.closed_at,
                purged_at     = now(),
                reason        = excluded.reason;
              with deleted as (delete from jobs where status = 'expired' returning 1)
              select count(*) from deleted;
            "
          )"
          echo "=== 本轮精确删除量 ==="
          echo "$deleted_count"
          psql "$JOBS_DATABASE_URL" -v ON_ERROR_STOP=1 -P pager=off <<'SQL'
          set statement_timeout = '1800s';
          \echo '=== VACUUM (ANALYZE) jobs（释放行空间供复用，非 FULL 不缩 db_size）==='
          vacuum (analyze) jobs;
          \echo '=== 剩余 status 分布 ==='
          select status, count(*) from jobs group by status order by count(*) desc;
          SQL
          echo "[purge-expired] done."
          export OPS_STARTED_AT="$started_at"
          export OPS_DELETED_COUNT="$deleted_count"
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          from datetime import datetime, timezone

          try:
              base = os.environ["SUPABASE_URL"].rstrip("/")
              key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
              body = json.dumps({
                  "module": "purge_expired",
                  "metrics": {"deleted": int(os.environ.get("OPS_DELETED_COUNT", "0"))},
                  "status": "success",
                  "started_at": os.environ["OPS_STARTED_AT"],
                  "finished_at": datetime.now(timezone.utc).isoformat(),
              }).encode()
              req = urllib.request.Request(
                  base + "/rest/v1/ops_runs",
                  data=body,
                  method="POST",
                  headers={
                      "apikey": key,
                      "Authorization": "Bearer " + key,
                      "Content-Type": "application/json",
                      "Prefer": "return=minimal",
                  },
              )
              urllib.request.urlopen(req, timeout=15).read()
          except Exception as exc:
              sys.stderr.write(
                  f"[ops-runs] purge_expired 台账写入失败（清理已完成，不受影响）: {type(exc).__name__}\n"
              )
          PY
