name: structural-audit

# 结构性审计执行器：按 crawler/audit_contract.yaml 逐条量「正常长什么样」，一条一行写 audit_results。
# 只读（每条 SQL 跑在 read only 事务里）。breach / error 是「发现」，不让本 workflow 变红；
# 只有台账写不进去才失败 —— 查了没落库 = 没查。
#
# 两条 cron（2026-09-19 起，配合创始人电脑上北京 09:00 跑的自动修复 session）：
#   · 北京 08:10（UTC 00:10）：给 09:00 的自动修复留「修之前的现状」——留够余量，
#     因为 GitHub 定时常延迟 10~30 分钟，08:10 触发到真正跑完可能已经 08:30+。
#   · 北京 09:45（UTC 01:45）：修复之后再量一遍，同一天 `audit_results` upsert 覆盖
#     08:10 那次的行（见 audit_runner.write_results 的 `on conflict (check_id, run_date)`），
#     这样 09:30 晨报（现改到 10:00）拿到的是「修完之后」的数字，不是修之前的旧值。
#   两次都避开整点（GitHub cron 整点常延迟 10~30 分钟）。
on:
  schedule:
    - cron: "10 0 * * *"
    - cron: "45 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只量不落库"
        type: boolean
        default: false
      force_fail:
        description: "故障演练：故意让本次失败，用来验证告警真能送达（schedule 触发时恒为 false）"
        type: boolean
        default: false

concurrency:
  group: structural-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
      JOBS_DATABASE_SSL_CA: ${{ secrets.JOBS_DATABASE_SSL_CA }}
      JOBS_DATABASE_TLS_SERVERNAME: ${{ secrets.JOBS_DATABASE_TLS_SERVERNAME }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
      # schedule 事件没有 inputs context——先判事件名再取 inputs.force_fail，
      # 保证 schedule 触发时这里恒是空字符串（= false），不会意外落到 workflow_dispatch 的默认值判断上。
      AUDIT_FORCE_FAIL: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_fail) && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crawler/requirements.txt
      - name: Install deps
        run: pip install -r crawler/requirements.txt
      - name: Run audit
        working-directory: crawler
        run: python3 audit_runner.py ${{ inputs.dry_run && '--dry-run' || '' }}
