name: moka-liveness

# Moka 撤岗核验：每条源「最近一轮抓全了的列表里没见到」的在招岗，逐岗问详情请求确认已停才下架。
# 为什么不直接按列表缺席下架、判据怎么来的、每道安全闸拦什么：见 crawler/moka_liveness.py 的模块注释。
#
# 定时轮次写库（创始人 2026-10-14 同意落库后加），占比上限用默认 0.5；手动触发默认只报数。
# UTC 03:10 = 排在重档（cron 18:00，实际 21:00~23:35 开跑、最长 180 分钟）之后，核的是当晚那一轮；
# 还在跑的源本轮跳过（run_in_progress），第二天再核。体检期望：audit_contract.yaml 的
# pipeline.moka_liveness_ran / jobs.moka_stale_active。
# 清存量那一次是手动跑的：apply=true，并把 max_expire_fraction 放宽（2026-10-14 带着存量时李宁是 167 / 331）。

on:
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "true = 真的写库；留空/false = 只 dry-run 报数"
        required: false
        default: "false"
      max_expire_fraction:
        description: "单条源拟下架占在招行数的上限，超了这条源不下架（日常 0.5；清存量时由人放宽）"
        required: false
        default: "0.5"
      only:
        description: "可选：只核源地址里含这一段的源（如 talent.catl.com）"
        required: false
        default: ""

concurrency:
  group: moka-liveness
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 150   # 日常几分钟；清存量那一次约 7 千行、每行问两次，按 4 个请求 / 秒约一小时
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - run: pip install -r crawler/requirements.txt

      - name: Verify Moka jobs missing from the latest complete list against the detail request
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
          JOBS_DATABASE_SSL_CA: ${{ secrets.JOBS_DATABASE_SSL_CA }}
          JOBS_DATABASE_TLS_SERVERNAME: ${{ secrets.JOBS_DATABASE_TLS_SERVERNAME }}
          APPLY: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.apply }}
          MAX_EXPIRE_FRACTION: ${{ github.event.inputs.max_expire_fraction }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -euo pipefail
          args=(--out moka-liveness-report.json --max-expire-fraction "${MAX_EXPIRE_FRACTION:-0.5}")
          if [ -n "${ONLY:-}" ]; then args+=(--only "$ONLY"); fi
          if [ "${APPLY:-}" = "true" ]; then args+=(--apply); fi
          python3 crawler/moka_liveness.py "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moka-liveness-report
          path: moka-liveness-report.json
          if-no-files-found: ignore
