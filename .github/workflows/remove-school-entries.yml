name: remove-school-entries

# wt 源「按院校设的投递入口」的**存量**清理：标题=院校名 ∧ 正文为空 → status='removed'（可逆，purge 不删）。
# 新增侧由 adapters/wt.py 的 _is_school_entry 闸门止住（bc8ef08）；这条 workflow 清的是闸门装上之前
# 已经灌进去的存量（2026-09-18 实测：中广核 957 行）。
#
# 手动触发、默认 dry-run、**--apply 必须点名公司**——不提供一键全清。理由与判据见
# crawler/remove_school_entries.py 的模块注释。

on:
  workflow_dispatch:
    inputs:
      company:
        description: "精确公司名，多家用逗号分隔（dry-run 可留空看全部；apply 必填）"
        required: false
        default: ""
      apply:
        description: "true = 真的写库；留空/false = 只 dry-run 报数"
        required: false
        default: "false"

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - run: pip install -r crawler/requirements.txt

      - name: Remove school-entry rows
        env:
          JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
          JOBS_DATABASE_SSL_CA: ${{ secrets.JOBS_DATABASE_SSL_CA }}
          JOBS_DATABASE_TLS_SERVERNAME: ${{ secrets.JOBS_DATABASE_TLS_SERVERNAME }}
        run: |
          set -euo pipefail
          args=()
          IFS=',' read -ra names <<< "${{ github.event.inputs.company }}"
          for n in "${names[@]}"; do
            trimmed="$(echo "$n" | xargs)"
            [ -n "$trimmed" ] && args+=(--company "$trimmed")
          done
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then args+=(--apply); else args+=(--check); fi
          python3 crawler/remove_school_entries.py "${args[@]}"
