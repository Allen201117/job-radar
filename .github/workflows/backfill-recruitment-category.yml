name: backfill-recruitment-category

# 招聘类型物化：把 JS 侧的权威裁决写进 jobs.recruitment_category / recruitment_explicit。
# 手动触发用于一次性回填与只读对拍；定时那次是「补漏」——爬虫入库时已经算好了，
# 这里只兜住极少数分类失败的行（NULL），不是常规路径。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check=只读对拍（绝不写库） / apply=写库"
        type: choice
        options: ["check", "apply"]
        default: "check"
      all:
        description: "apply 时是否全量重算覆盖（false=只补 NULL）"
        type: boolean
        default: false
      limit:
        description: "只处理前 N 行（留空=不限，用于小样本试跑）"
        type: string
        default: ""
  schedule:
    # 每 2 小时补一次 NULL（便宜）：库里的触发器一发现「分类依据变了」就把结论置 NULL
    # （jobs-db/schema.sql 的 jobs_guard_recruitment_class），这条负责把它们重新算出来。
    # NULL 期间检索会退回安全的信号超集，结果仍然正确、只是候选略宽，所以不必更频繁。
    # 走部分索引 jobs_recruitment_unclassified_idx，只碰真正待算的那几百行。
    - cron: "17 */2 * * *"
    # 每天 UTC 19:30 再跑一次**全量重算**兜底：抓取链之后、避开 21:00 UTC 的连接峰值。
    # 触发器已经堵住了「写入方算错」这条路，这次全量是防「规则本身改了」——
    # lib/china-keyword-expansion.js 的裁决逻辑一改，全库存量结论就都该重算一遍。
    # 成本可接受：全表 42 万行读一遍约 3 分钟，且只写「算出来和存的不一样」的行。
    - cron: "30 19 * * *"

concurrency:
  group: backfill-recruitment-category
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      # 只装脚本真正用到的那一个包，不跑 npm ci。
      # 原因：仓库的 package-lock.json 与 package.json 目前不同步（@emnapi 几个传递依赖），
      # npm ci 是严格模式会直接失败；而本脚本只需要 pg，没必要为它拉整棵依赖树。
      - run: npm install --no-save --no-audit --no-fund --ignore-scripts "pg@^8.13.1"
      - name: Run backfill
        env:
          JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
          JOBS_DATABASE_SSL_CA: ${{ secrets.JOBS_DATABASE_SSL_CA }}
          JOBS_DATABASE_TLS_SERVERNAME: ${{ secrets.JOBS_DATABASE_TLS_SERVERNAME }}
        run: |
          set -euo pipefail
          if [ -z "${JOBS_DATABASE_URL:-}" ]; then
            echo "::error::JOBS_DATABASE_URL 未配置"; exit 1
          fi
          # 定时触发一律 apply；只有每天那一次走全量重算，2 小时一次的那条只补 NULL。
          # ⚠️ 别把两条定时都设成全量：每 2 小时全表扫 42 万行是白烧香港库的 CPU。
          MODE="${{ github.event.inputs.mode || 'apply' }}"
          ARGS="--$MODE"
          if [ "${{ github.event.inputs.all }}" = "true" ] || [ "${{ github.event.schedule }}" = "30 19 * * *" ]; then
            ARGS="$ARGS --all"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          echo "运行参数：$ARGS"
          node scripts/backfill-recruitment-category.js $ARGS
