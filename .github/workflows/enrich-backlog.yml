name: enrich-backlog
# JD summary backlog drain（P1，httpx-detail 类）：从 Postgres 队列取空 summary 的 active 岗，
# 按 jd_url 反推官方 detail 端点富化（crawler/enrich.py），httpx 并发回写。无浏览器 → 不装 chromium。
# 与 daily-crawl(抓列表) / enrich-crawl(浏览器源+轮转) 解耦；按 adapter 分片，shard 间不重叠。
# 死信：enrich_fail_count≥3 的行不再入队（迁移 133）。browser 类(beisen/moka/feishu)P2 另开 shard。
# 已支持 httpx detail 的海外 ATS：workday/oracle/eightfold/smartrecruiters/successfactors/greenhouse/lever/amazon/microsoft。
# phenom 不进本矩阵（SPA 壳无 httpx 正文）；google 有 _detail_google（ENRICH_REGISTRY）在矩阵内。
# 2026-08-28：补 wt/tencent/vivo/avature/huawei——这五个 detail fetcher 都能返回真实正文
# （wt=workContent+serviceCondition / tencent=Responsibility+Requirement / vivo=job_desc /
#   avature=详情页 / huawei=mainBusiness），此前只被 liveness-sweep 探活、空 summary 永远补不上。

on:
  schedule:
    - cron: "0 */3 * * *"   # 每 3 小时一轮（公开仓库分钟无限）
  workflow_dispatch:
    inputs:
      limit:
        description: "单 shard 本轮最多富化多少岗"
        required: false
        default: "20000"
      workers:
        description: "并发线程数"
        required: false
        default: "8"

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 50   # 远低于 6h 硬杀；httpx 富化快，单 shard 应分钟级
    strategy:
      fail-fast: false
      # 扩海外矩阵后仍限制同时 5 个 shard，避免把香港库连接峰值从原 5 片直接放大到 9 片。
      max-parallel: 5
      # 按 adapter 一片，shard 间互不重叠（各 drain 自己 adapter 的 backlog）。
      matrix:
        adapter: [hotjob, wt, workday, oracle, eightfold, smartrecruiters, successfactors, greenhouse, lever,
                  amazon, microsoft, siemens, avature, google, tencent, vivo, huawei,
                  jd, antgroup, haier, ashby, mihoyo, tencent_music,
                  iguopin, pinduoduo]
        # meituan_campus 不进本矩阵：_detail_meituan 是 liveness-only（正文列表自带、detail 恒空），
        # 进富化队列只会空转烧 fail_count；它在 liveness-sweep 矩阵里做探活。
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Phase 1：jobs 在自建香港 PG；不注入则 crawler/jobs_db.py 回退空 Supabase（见 daily-crawl.yml 注释）。
      JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
      JOBS_DATABASE_SSL_CA: ${{ secrets.JOBS_DATABASE_SSL_CA }}
      JOBS_DATABASE_TLS_SERVERNAME: ${{ secrets.JOBS_DATABASE_TLS_SERVERNAME }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crawler/requirements.txt

      - name: Install crawler dependencies
        run: pip install -r crawler/requirements.txt

      - name: Drain summary backlog (${{ matrix.adapter }})
        run: |
          python crawler/enrich_backlog.py \
            --adapter "${{ matrix.adapter }}" \
            --limit "${{ github.event.inputs.limit || '20000' }}" \
            --workers "${{ github.event.inputs.workers || '8' }}"

  # 分片「够不着香港库」时会软失败（记台账 + 退 0），因为那多半只是该 runner 的出口 IP 被掐，
  # 不该让 1/12 的分片把整轮拖红。代价是「库真挂了」也会全绿 —— 这一步就是补这个洞：
  # 换一台干净 runner 亲自连一次库，连不上才是真故障，红在这里。
  # 诚实边界：guard 用的是又一个随机出口 IP，所以它是很强的信号、不是数学证明；
  # 每个软失败分片都在 ops_runs 台账里记了 status=failed，运营看板能看到真实损耗。
  guard:
    needs: drain
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
      JOBS_DATABASE_SSL_CA: ${{ secrets.JOBS_DATABASE_SSL_CA }}
      JOBS_DATABASE_TLS_SERVERNAME: ${{ secrets.JOBS_DATABASE_TLS_SERVERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crawler/requirements.txt
      - name: Install crawler dependencies
        run: pip install -r crawler/requirements.txt
      - name: Probe jobs DB reachability
        working-directory: crawler
        run: python jobs_db_probe.py
